<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LosBroles Widget Lab</title>
    <link rel="stylesheet" href="src/styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">StreamElements / Twitch sandbox</p>
        <h1>LosBroles Widget Lab</h1>
      </div>
      <div id="appStatus" class="status-pill" role="status">Inicializando</div>
    </header>

    <main class="lab-layout">
      <aside class="control-panel" aria-label="Controles del laboratorio">
        <section class="panel-section">
          <label class="field-label" for="widgetSelect">Widget</label>
          <select id="widgetSelect" class="select-input"></select>
          <div id="widgetMeta" class="meta-block"></div>
        </section>

        <section class="panel-section validation-panel" aria-label="Validacion de widgets">
          <h2>Widget Store</h2>
          <button id="validateWidgetsButton" type="button">Validate widgets</button>
          <div id="validationSummary" class="validation-summary" role="status">Sin validar</div>
          <ol id="validationResults" class="validation-results"></ol>
        </section>

        <section class="panel-section debug-panel" aria-label="Debug del widget">
          <h2>Debug</h2>
          <label class="toggle-row">
            <input id="debugModeToggle" type="checkbox" checked>
            <span>Mostrar logs del iframe</span>
          </label>
          <button id="copyDebugReportButton" type="button" class="secondary-button">Copy debug report</button>
        </section>

        <section class="panel-section responsive-panel" aria-label="Responsive preview">
          <h2>Responsive</h2>
          <label class="field-label" for="viewportPresetSelect">Preset</label>
          <select id="viewportPresetSelect" class="select-input">
            <option value="1920x1080">1920x1080</option>
            <option value="1280x720">1280x720</option>
            <option value="960x240">960x240</option>
            <option value="800x200" selected>800x200</option>
          </select>

          <label class="field-label" for="zoomSelect">Zoom visual</label>
          <select id="zoomSelect" class="select-input">
            <option value="0.25">25%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
          </select>

          <label class="field-label" for="previewBackgroundSelect">Fondo</label>
          <select id="previewBackgroundSelect" class="select-input">
            <option value="transparent">Transparente</option>
            <option value="gray" selected>Gris</option>
            <option value="chroma">Verde chroma</option>
            <option value="dark">Captura oscura</option>
          </select>
        </section>

        <section class="panel-section button-stack" aria-label="Acciones">
          <button id="reloadWidgetButton" type="button">Reload widget</button>
          <button id="emitWidgetLoadButton" type="button" data-se-action="widgetLoad">onWidgetLoad</button>
          <button id="emitChatMessageButton" type="button" data-se-action="chatMessage">chat message</button>
          <button id="emitFollowButton" type="button" data-se-action="follow">follow</button>
          <button id="emitSubscriberButton" type="button" data-se-action="subscriber">subscriber</button>
          <button id="emitTipButton" type="button" data-se-action="tip">tip</button>
          <button id="emitCheerButton" type="button" data-se-action="cheer">cheer</button>
          <button id="emitKvStoreButton" type="button" data-se-action="kvstoreUpdate">kvstore:update</button>
          <button id="clearLogsButton" type="button" class="secondary-button">Clear logs</button>
        </section>

        <section class="panel-section">
          <div class="payload-heading">
            <label class="field-label" for="eventPayload">StreamElements payload JSON</label>
            <span id="payloadTypeLabel" class="payload-type">onWidgetLoad</span>
          </div>
          <textarea id="eventPayload" class="payload-input" spellcheck="false"></textarea>
          <div id="payloadError" class="payload-error" role="alert" hidden></div>
        </section>

        <section class="panel-section prediction-panel" aria-label="Twitch EventSub predicciones">
          <h2>Twitch Predictions</h2>
          <label class="field-label" for="predictionTitle">Titulo</label>
          <input id="predictionTitle" class="text-input" type="text" value="Quien gana la siguiente ronda?">

          <div class="split-fields">
            <label>
              <span class="field-label">Duracion</span>
              <input id="predictionDuration" class="text-input" type="number" min="1" step="1" value="60">
            </label>
            <label>
              <span class="field-label">Opciones</span>
              <input id="predictionOutcomeCount" class="text-input" type="number" min="2" max="10" step="1" value="2">
            </label>
          </div>

          <label class="field-label" for="predictionWinningOutcome">winning_outcome_id</label>
          <select id="predictionWinningOutcome" class="select-input"></select>

          <div id="predictionOutcomes" class="prediction-outcomes"></div>

          <div class="button-stack">
            <button id="predictionCreateButton" type="button">Crear prediccion</button>
            <button id="predictionVoteOneButton" type="button">Sumar votos opcion 1</button>
            <button id="predictionVoteTwoButton" type="button">Sumar votos opcion 2</button>
            <button id="predictionVoteRandomButton" type="button">Sumar votos aleatorios</button>
            <button id="predictionLockButton" type="button">Bloquear prediccion</button>
            <button id="predictionEndOneButton" type="button">Finalizar ganando opcion 1</button>
            <button id="predictionEndTwoButton" type="button">Finalizar ganando opcion 2</button>
            <button id="predictionCancelButton" type="button">Cancelar prediccion</button>
            <button id="predictionResetButton" type="button" class="secondary-button">Reset total</button>
          </div>
        </section>

        <section class="panel-section worker-panel" aria-label="Cloudflare Worker mock">
          <h2>Worker WebSocket</h2>
          <label class="toggle-row">
            <input id="workerInterceptToggle" type="checkbox" checked>
            <span>Interceptar WebSocket del Worker</span>
          </label>

          <label class="field-label" for="workerUrlInput">Worker URL real</label>
          <input id="workerUrlInput" class="text-input" type="url" placeholder="wss://.../ws">

          <div class="button-stack">
            <button id="workerWelcomeButton" type="button">Enviar welcome</button>
            <button id="workerErrorButton" type="button">Enviar bridge.error</button>
            <button id="workerBeginButton" type="button">Worker begin</button>
            <button id="workerProgressButton" type="button">Worker progress</button>
            <button id="workerLockButton" type="button">Worker lock</button>
            <button id="workerEndButton" type="button">Worker end</button>
          </div>

          <div class="worker-console">
            <div class="worker-console-header">
              <h3>Conexiones WebSocket mock</h3>
              <span id="workerConnectionCount">0</span>
            </div>
            <ol id="workerConnectionList" class="worker-connection-list"></ol>
          </div>
        </section>

        <section class="panel-section">
          <h2>Fields</h2>
          <dl id="fieldsList" class="fields-list"></dl>
        </section>
      </aside>

      <section class="preview-column" aria-label="Previsualizacion">
        <div id="previewShell" class="preview-shell preview-bg-gray">
          <div id="iframeViewport" class="iframe-viewport">
            <iframe id="widgetFrame" title="Widget preview" sandbox="allow-scripts"></iframe>
          </div>
        </div>

        <section class="console-panel" aria-label="Consola">
          <div class="console-header">
            <h2>Console</h2>
            <span id="logCount" class="log-count">0 logs</span>
          </div>
          <ol id="logList" class="log-list"></ol>
        </section>
      </section>
    </main>
  </body>
</html>
